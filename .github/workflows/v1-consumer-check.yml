name: v1 consumer check (throwaway)
on: pull_request
permissions:
  contents: read
  pull-requests: read
jobs:
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hybridforgelab/shipshape-action@v1
        with:
          rapidapi-key: ""
